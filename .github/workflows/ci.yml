name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend (unit tests, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # postinstall runs `prisma generate`, which only needs the schema file
      # (DATABASE_URL is not required to generate the client) — no DB
      # connection needed for this job.
      - name: Install backend dependencies
        run: npm ci

      # Deliberately NOT `npm test` — that runs every file in test/, and 2 of
      # them (syncIdempotency, dailyBossAccess) can't run here for reasons
      # unrelated to CI setup: syncIdempotency runs a real sync script that
      # reads data/wiki-crawl/, which is gitignored and doesn't exist in a
      # checkout; dailyBossAccess is a production-data canary (asserts a
      # category stays empty in the *real, accumulated* catalog) that would
      # trivially pass against any empty database, giving false confidence.
      # Both stay manual/local-only — that's not a CI gap to close, it's
      # what they're actually for. Only the 2 DB-independent files run here.
      - name: Run DB-independent unit tests
        run: node --test test/categoryClassifier.test.js test/subcategories.test.js

  test-db:
    name: Backend (integration tests, ephemeral DB)
    runs-on: ubuntu-latest
    # A disposable Postgres, alive only for this job — never the real Neon
    # database. No secret needed: the connection string below is always the
    # same fixed value, local to this runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci

      # Same command used locally (see CLAUDE.md) — no migrations folder in
      # this project, db push creates the schema from scratch every run.
      - name: Create schema on the ephemeral DB
        run: npx prisma db push --skip-generate

      # deduplication.test.js is self-contained (creates/deletes its own
      # fixture row, see its own comment) — unlike the 2 excluded above, it
      # doesn't depend on any pre-existing catalog data, so it runs here for
      # the first time. storeRoutes.test.js (new) covers the ownership/
      # soldAt/price/world/extraMoveCount business logic in
      # src/routes/stores.js — each test creates and tears down its own
      # User/Store/CatalogItem fixtures, same self-contained pattern.
      - name: Run integration tests
        run: node --test test/deduplication.test.js test/storeRoutes.test.js

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
