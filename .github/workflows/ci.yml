e.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token"}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci

      # Same command used locally (see CLAUDE.md) — no migrations folder in
      # this project, db push creates the schema from scratch every run.
      - name: Create schema on the ephemeral DB
        run: npx prisma db push --skip-generate

      # deduplication.test.js is self-contained (creates/deletes its own
      # fixture row, see its own comment) — unlike the 2 excluded above, it
      # doesn't depend on any pre-existing catalog data, so it runs here for
      # the first time. storeRoutes.test.js (new) covers the ownership/
      # soldAt/price/world/extraMoveCount business logic in
      # src/routes/stores.js — each test creates and tears down its own
      # User/Store/CatalogItem fixtures, same self-contained pattern.
      - name: Run integration tests
        run: node --test test/deduplication.test.js test/storeRoutes.test.js

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
