name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    name: Backend (unit tests, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # postinstall runs `prisma generate`, which only needs the schema file
      # (DATABASE_URL is not required to generate the client) — no DB
      # connection needed for this job.
      - name: Install backend dependencies
        run: npm ci

      # Deliberately NOT `npm test` — that runs every file in test/, and 2 of
      # them (syncIdempotency, dailyBossAccess) can't run here for reasons
      # unrelated to CI setup: syncIdempotency runs a real sync script that
      # reads data/wiki-crawl/, which is gitignored and doesn't exist in a
      # checkout; dailyBossAccess is a production-data canary (asserts a
      # category stays empty in the *real, accumulated* catalog) that would
      # trivially pass against any empty database, giving false confidence.
      # Both stay manual/local-only — that's not a CI gap to close, it's
      # what they're actually for. Only the 2 DB-independent files run here.
      - name: Run DB-independent unit tests
        run: node --test test/categoryClassifier.test.js test/subcategories.test.js

  test-db:
    name: Backend (integration tests, ephemeral DB)
    runs-on: ubuntu-latest
    # A disposable Postgres, alive only for this job — never the real Neon
    # database. No secret needed: the connection string below is always the
    # same fixed value, local to this runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # storeRoutes.test.js requires src/routes/stores.js, which transitively
      # requires src/authMiddleware.js -> src/firebaseAdmin.js — that module
      # throws at require-time (before any test even runs) if neither
      # FIREBASE_SERVICE_ACCOUNT_JSON nor FIREBASE_SERVICE_ACCOUNT_PATH is
      # set. This is a throwaway, non-functional RSA keypair (generated with
      # `openssl genrsa`, never used to sign anything real) — it exists only
      # to satisfy admin.credential.cert()'s structural validation at module
      # load. It is never used to actually authenticate: every test in this
      # suite bypasses requireAuth entirely (see storeRoutes.test.js's own
      # comment) and never calls verifyIdToken. Not a secret — safe to check
      # into a public workflow file.
